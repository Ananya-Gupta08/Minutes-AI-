services:
  - type: web
    name: minutes-ai-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/minutes_ai.db
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "true"
    disk:
      name: minutes-ai-data
      mountPath: /data
      sizeGB: 1
